---
layout: default
---
<section class="hero" aria-labelledby="hero-title">
  <div class="hero-copy"><p class="eyebrow"><span class="status-dot"></span> 个人博客</p><h1 id="hero-title">Guoxu<br><em>Zhao.</em></h1><p class="hero-note">一个记录与分享的地方。</p><div class="hero-links"><a class="text-link" href="{{ '/about/' | relative_url }}">关于我 <span aria-hidden="true">↗</span></a><a class="text-link hero-secondary" href="#journal">浏览文章 <span aria-hidden="true">↘</span></a></div></div>
  <figure class="hero-portrait"><img src="{{ '/assets/images/guoxu-zhao.jpg' | relative_url }}" alt="Guoxu Zhao 的个人照片" width="1152" height="1152"><figcaption><span>GUOXU ZHAO</span><span>PERSONAL BLOG</span></figcaption></figure>
</section>
<section class="journal" id="journal" aria-labelledby="journal-title">
  <div class="section-heading"><div><p class="eyebrow">THE JOURNAL</p><h2 id="journal-title">文章与记录<span>.</span></h2></div><span class="section-count">{{ site.posts.size | prepend: '0' | slice: -2, 2 }} / POSTS</span></div>
  <div class="post-list">
  {% for post in site.posts %}
    <a class="post-row" href="{{ post.url | relative_url }}"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time><span class="post-title">{{ post.title | escape }}</span><span class="post-arrow" aria-hidden="true">↗</span></a>
  {% else %}
    <div class="empty-state"><span class="empty-symbol" aria-hidden="true">✳</span><p>第一篇文章，敬请期待。</p></div>
  {% endfor %}
  </div>
</section>
