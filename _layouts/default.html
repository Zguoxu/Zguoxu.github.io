<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="theme-color" content="#f8f6f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1c19" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <script>document.documentElement.classList.add('js');</script>
  <script>
    (function () {
      var r = document.documentElement, t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      r.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="wash" aria-hidden="true"><span class="wash-blob" data-speed="0.08" style="--top:1%;--left:58%;--size:780px;--c:var(--wash-1)"><b class="wash-spin wash-a" style="--delay:-0s"><i class="wash-shape s1"></i><i class="wash-shape s2"></i></b></span><span class="wash-blob" data-speed="0.14" style="--top:14%;--left:-14%;--size:620px;--c:var(--wash-2)"><b class="wash-spin wash-b" style="--delay:-7s"><i class="wash-shape s1"></i><i class="wash-shape s2"></i></b></span><span class="wash-blob" data-speed="0.1" style="--top:30%;--left:62%;--size:700px;--c:var(--wash-3)"><b class="wash-spin wash-c" style="--delay:-14s"><i class="wash-shape s1"></i><i class="wash-shape s2"></i></b></span><span class="wash-blob" data-speed="0.18" style="--top:50%;--left:-10%;--size:640px;--c:var(--wash-1)"><b class="wash-spin wash-a" style="--delay:-21s"><i class="wash-shape s1"></i><i class="wash-shape s2"></i></b></span><span class="wash-blob" data-speed="0.06" style="--top:68%;--left:55%;--size:720px;--c:var(--wash-2)"><b class="wash-spin wash-b" style="--delay:-28s"><i class="wash-shape s1"></i><i class="wash-shape s2"></i></b></span><span class="wash-blob" data-speed="0.12" style="--top:86%;--left:10%;--size:760px;--c:var(--wash-3)"><b class="wash-spin wash-c" style="--delay:-35s"><i class="wash-shape s1"></i><i class="wash-shape s2"></i></b></span></div>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#about">About</a><a href="{{ '/' | relative_url }}#profile">Experience</a><a href="{{ '/' | relative_url }}#skills">Skills</a><a href="{{ '/' | relative_url }}#honors">Honors &amp; Awards</a><a href="{{ '/' | relative_url }}#journal">Learning Notes</a><button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button></nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</span></footer>
  </div>
  <script>
    (function () {
      var items = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      items.forEach(function (el) { io.observe(el); });
    })();
  </script>
  <script>
    (function () {
      var el = document.querySelector('.hero-note');
      if (!el) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var text = el.textContent.trim();
      if (reduce || !text) { el.classList.add('tw-ready'); return; }
      el.setAttribute('aria-label', text);
      var wrap = document.createElement('span');
      wrap.setAttribute('aria-hidden', 'true');
      var chars = [];
      text.split(' ').forEach(function (word, i, all) {
        var w = document.createElement('span');
        w.className = 'tw-word';
        Array.from(word).forEach(function (c) {
          var s = document.createElement('span');
          s.className = 'tw-ch';
          s.textContent = c;
          w.appendChild(s);
          chars.push(s);
        });
        wrap.appendChild(w);
        if (i < all.length - 1) wrap.appendChild(document.createTextNode(' '));
      });
      var cursor = document.createElement('span');
      cursor.className = 'tw-cursor';
      el.textContent = '';
      el.appendChild(wrap);
      chars[0].parentNode.insertBefore(cursor, chars[0]);
      el.classList.add('tw-ready');
      var n = 0;
      function step() {
        var c = chars[n];
        c.classList.add('on');
        n++;
        if (n < chars.length) chars[n].parentNode.insertBefore(cursor, chars[n]);
        else c.parentNode.appendChild(cursor);
        if (n < chars.length) setTimeout(step, /[,.]/.test(c.textContent) ? 320 : 38 + Math.random() * 34);
      }
      setTimeout(step, 700);
    })();
  </script>
  <script>
    (function () {
      var blobs = document.querySelectorAll('.wash-blob');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!blobs.length || reduce) return;
      var ticking = false;
      function update() {
        var y = window.pageYOffset;
        blobs.forEach(function (b) { b.style.transform = 'translate3d(0,' + (y * b.dataset.speed).toFixed(1) + 'px,0)'; });
        ticking = false;
      }
      window.addEventListener('scroll', function () {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
      update();
    })();
  </script>
  <script>
    (function () {
      var spark = document.querySelector('.eye-spark');
      if (!spark || !window.matchMedia) return;
      var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!fine || reduce) return;
      var rays = Array.prototype.slice.call(spark.querySelectorAll('.ray')).map(function (el) {
        return { el: el, a: parseFloat(el.style.getPropertyValue('--a')), t: 0, s: 1 };
      });
      spark.classList.add('eye-on');
      var mx = null, my = null, raf = 0;
      function frame() {
        raf = 0;
        var moving = false, cx = 0, cy = 0;
        if (mx !== null) {
          var r = spark.getBoundingClientRect();
          cx = r.left + r.width / 2;
          cy = r.top + r.height / 2;
        }
        rays.forEach(function (ray) {
          var tt = 0, ts = 1;
          if (mx !== null) {
            var p = Math.atan2(my - cy, mx - cx);
            var diff = p - ray.a * Math.PI / 180;
            tt = Math.sin(diff) * 13;
            ts = 1 + 0.12 * Math.max(0, Math.cos(diff));
          }
          ray.t += (tt - ray.t) * 0.12;
          ray.s += (ts - ray.s) * 0.12;
          if (Math.abs(tt - ray.t) > 0.02 || Math.abs(ts - ray.s) > 0.0005) moving = true;
          ray.el.style.setProperty('--t', ray.t.toFixed(2) + 'deg');
          ray.el.style.setProperty('--s', ray.s.toFixed(3));
        });
        if (moving) raf = requestAnimationFrame(frame);
      }
      function kick() { if (!raf) raf = requestAnimationFrame(frame); }
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType && e.pointerType !== 'mouse') return;
        mx = e.clientX; my = e.clientY; kick();
      }, { passive: true });
      document.addEventListener('mouseleave', function () { mx = null; my = null; kick(); });
    })();
  </script>
  <script>
    (function () {
      var r = document.documentElement, b = document.querySelector('.theme-toggle');
      if (!b) return;
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      var colors = { light: '#f8f6f0', dark: '#1f1c19' };
      function apply(t) {
        r.setAttribute('data-theme', t);
        b.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        metas.forEach(function (m) { m.removeAttribute('media'); m.setAttribute('content', colors[t]); });
      }
      apply(r.getAttribute('data-theme'));
      b.addEventListener('click', function () {
        var t = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(t);
        try { localStorage.setItem('theme', t); } catch (e) {}
      });
      var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      if (mq && mq.addEventListener) mq.addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (x) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
