<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#profile">Experience</a><a href="{{ '/' | relative_url }}#honors">Honors &amp; Awards</a><a href="{{ '/' | relative_url }}#journal">Learning Notes</a></nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</span><span>Writing · Thinking · Documenting</span></footer>
  </div>
</body>
</html>
