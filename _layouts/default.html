<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="theme-color" content="#f8f6f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1c19" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#about">About</a><a href="{{ '/' | relative_url }}#profile">Experience</a><a href="{{ '/' | relative_url }}#skills">Skills</a><a href="{{ '/' | relative_url }}#honors">Honors &amp; Awards</a><a href="{{ '/' | relative_url }}#journal">Learning Notes</a></nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</span></footer>
  </div>
  <script>
    (function () {
      var items = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      items.forEach(function (el) { io.observe(el); });
    })();
  </script>
  <script>
    (function () {
      var el = document.querySelector('.hero-note');
      if (!el) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var text = el.textContent.trim();
      if (reduce || !text) { el.classList.add('tw-ready'); return; }
      el.setAttribute('aria-label', text);
      var wrap = document.createElement('span');
      wrap.setAttribute('aria-hidden', 'true');
      var chars = [];
      text.split(' ').forEach(function (word, i, all) {
        var w = document.createElement('span');
        w.className = 'tw-word';
        Array.from(word).forEach(function (c) {
          var s = document.createElement('span');
          s.className = 'tw-ch';
          s.textContent = c;
          w.appendChild(s);
          chars.push(s);
        });
        wrap.appendChild(w);
        if (i < all.length - 1) wrap.appendChild(document.createTextNode(' '));
      });
      var cursor = document.createElement('span');
      cursor.className = 'tw-cursor';
      el.textContent = '';
      el.appendChild(wrap);
      chars[0].parentNode.insertBefore(cursor, chars[0]);
      el.classList.add('tw-ready');
      var n = 0;
      function step() {
        var c = chars[n];
        c.classList.add('on');
        n++;
        if (n < chars.length) chars[n].parentNode.insertBefore(cursor, chars[n]);
        else c.parentNode.appendChild(cursor);
        if (n < chars.length) setTimeout(step, /[,.]/.test(c.textContent) ? 320 : 38 + Math.random() * 34);
      }
      setTimeout(step, 700);
    })();
  </script>
</body>
</html>
