<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <script>document.documentElement.classList.add('js');</script>
  <script>
    (function () {
      var r = document.documentElement, t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      r.setAttribute('data-theme', t);
      var l = null, q = null;
      try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
      if (q === 'zh' || q === 'en') { l = q; try { localStorage.setItem('lang', q); } catch (e) {} }
      if (!l) { try { l = localStorage.getItem('lang'); } catch (e) {} }
      if (l !== 'zh' && l !== 'en') l = /^zh/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'zh' : 'en';
      r.setAttribute('data-lang', l);
      r.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-shell header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}"><bdi class="en">{{ site.title | escape }}</bdi><bdi class="zh">赵国旭</bdi><span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#about"><bdi class="en">About</bdi><bdi class="zh">关于我</bdi></a><a href="{{ '/' | relative_url }}#profile"><bdi class="en">Experience</bdi><bdi class="zh">经历</bdi></a><a href="{{ '/' | relative_url }}#skills"><bdi class="en">Skills</bdi><bdi class="zh">技能</bdi></a><a href="{{ '/' | relative_url }}#honors"><bdi class="en">Awards</bdi><bdi class="zh">奖项</bdi></a><a href="{{ '/' | relative_url }}#journal"><bdi class="en">Learning Notes</bdi><bdi class="zh">学习笔记</bdi></a></nav>
      <span class="toggles"><button class="lang-toggle" type="button" aria-label="Switch language" title="English / 中文"><span class="lg-en">EN</span><span class="lg-zh">中</span></button><button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button></span>
    </div>
  </header>
  <main class="site-shell">{{ content }}</main>
  <footer class="site-footer">
    <div class="site-shell footer-inner">
      <a class="wordmark footer-wordmark" href="{{ '/' | relative_url }}"><bdi class="en">{{ site.title | escape }}</bdi><bdi class="zh">赵国旭</bdi><span aria-hidden="true">.</span></a>
      <nav class="footer-nav" aria-label="Footer navigation"><a href="{{ '/' | relative_url }}#about"><bdi class="en">About</bdi><bdi class="zh">关于我</bdi></a><a href="{{ '/' | relative_url }}#profile"><bdi class="en">Experience</bdi><bdi class="zh">经历</bdi></a><a href="{{ '/' | relative_url }}#skills"><bdi class="en">Skills</bdi><bdi class="zh">技能</bdi></a><a href="{{ '/' | relative_url }}#honors"><bdi class="en">Awards</bdi><bdi class="zh">奖项</bdi></a><a href="{{ '/' | relative_url }}#journal"><bdi class="en">Learning Notes</bdi><bdi class="zh">学习笔记</bdi></a></nav>
      <p class="footer-copy"><span>© {{ 'now' | date: '%Y' }} <bdi class="en">{{ site.title | escape }}</bdi><bdi class="zh">赵国旭</bdi></span></p>
    </div>
  </footer>
  <script>
    (function () {
      var items = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      items.forEach(function (el) { io.observe(el); });
    })();
  </script>
  <script>
    (function () {
      var r = document.documentElement, b = document.querySelector('.lang-toggle');
      function labels(l) {
        document.querySelectorAll('[data-en][data-zh]').forEach(function (el) { el.setAttribute(el.tagName === 'IMG' ? 'alt' : 'aria-label', el.getAttribute('data-' + l)); });
        if (b) b.setAttribute('aria-label', l === 'zh' ? '切换语言，当前为中文' : 'Switch language, currently English');
      }
      labels(r.getAttribute('data-lang'));
      if (!b) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var busy = false;
      function swap(l) {
        r.setAttribute('data-lang', l);
        r.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
        try { localStorage.setItem('lang', l); } catch (e) {}
        labels(l);
        document.dispatchEvent(new Event('langchange'));
      }
      b.addEventListener('click', function () {
        if (busy) return;
        var l = r.getAttribute('data-lang') === 'zh' ? 'en' : 'zh';
        if (reduce) { swap(l); return; }
        busy = true;
        r.classList.add('lang-out');
        setTimeout(function () {
          swap(l);
          r.classList.remove('lang-out');
          setTimeout(function () { busy = false; }, 160);
        }, 160);
      });
    })();
  </script>
  <script>
    (function () {
      var note = document.querySelector('.hero-note');
      if (!note) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var r = document.documentElement, timer = 0, cursor = document.createElement('span');
      cursor.className = 'tw-cursor';
      var parts = {};
      ['en', 'zh'].forEach(function (l) {
        var el = note.querySelector('.' + l);
        if (el) parts[l] = { el: el, text: el.textContent.trim() };
      });
      function plain() {
        Object.keys(parts).forEach(function (l) { parts[l].el.textContent = parts[l].text; });
        if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
      }
      function type(delay) {
        clearTimeout(timer);
        plain();
        var l = r.getAttribute('data-lang') === 'zh' ? 'zh' : 'en';
        var p = parts[l];
        if (reduce || !p || !p.text) { note.classList.add('tw-ready'); return; }
        note.setAttribute('aria-label', p.text);
        var wrap = document.createElement('span');
        wrap.setAttribute('aria-hidden', 'true');
        var chars = [];
        var words = l === 'zh' ? Array.from(p.text).map(function (c) { return c; }) : p.text.split(' ');
        words.forEach(function (word, i, all) {
          var w = document.createElement('span');
          w.className = 'tw-word';
          Array.from(word).forEach(function (c) {
            var s = document.createElement('span');
            s.className = 'tw-ch';
            s.textContent = c;
            w.appendChild(s);
            chars.push(s);
          });
          wrap.appendChild(w);
          if (l === 'en' && i < all.length - 1) wrap.appendChild(document.createTextNode(' '));
        });
        p.el.textContent = '';
        p.el.appendChild(wrap);
        chars[0].parentNode.insertBefore(cursor, chars[0]);
        note.classList.add('tw-ready');
        var n = 0;
        function step() {
          var c = chars[n];
          c.classList.add('on');
          n++;
          if (n < chars.length) chars[n].parentNode.insertBefore(cursor, chars[n]);
          else c.parentNode.appendChild(cursor);
          if (n < chars.length) timer = setTimeout(step, /[,.，。]/.test(c.textContent) ? 320 : 38 + Math.random() * 34);
        }
        timer = setTimeout(step, delay);
      }
      type(700);
      document.addEventListener('langchange', function () { type(150); });
    })();
  </script>
  <script>
    (function () {
      var spark = document.querySelector('.eye-spark');
      if (!spark || !window.matchMedia) return;
      var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!fine || reduce) return;
      var rays = Array.prototype.slice.call(spark.querySelectorAll('.ray')).map(function (el) {
        return { el: el, a: parseFloat(el.style.getPropertyValue('--a')), t: 0, s: 1 };
      });
      spark.classList.add('eye-on');
      var mx = null, my = null, raf = 0;
      function frame() {
        raf = 0;
        var moving = false, cx = 0, cy = 0;
        if (mx !== null) {
          var r = spark.getBoundingClientRect();
          cx = r.left + r.width / 2;
          cy = r.top + r.height / 2;
        }
        rays.forEach(function (ray) {
          var tt = 0, ts = 1;
          if (mx !== null) {
            var p = Math.atan2(my - cy, mx - cx);
            var diff = p - ray.a * Math.PI / 180;
            tt = Math.sin(diff) * 13;
            ts = 1 + 0.12 * Math.max(0, Math.cos(diff));
          }
          ray.t += (tt - ray.t) * 0.12;
          ray.s += (ts - ray.s) * 0.12;
          if (Math.abs(tt - ray.t) > 0.02 || Math.abs(ts - ray.s) > 0.0005) moving = true;
          ray.el.style.setProperty('--t', ray.t.toFixed(2) + 'deg');
          ray.el.style.setProperty('--s', ray.s.toFixed(3));
        });
        if (moving) raf = requestAnimationFrame(frame);
      }
      function kick() { if (!raf) raf = requestAnimationFrame(frame); }
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType && e.pointerType !== 'mouse') return;
        mx = e.clientX; my = e.clientY; kick();
      }, { passive: true });
      document.addEventListener('mouseleave', function () { mx = null; my = null; kick(); });
    })();
  </script>
  <script>
    (function () {
      var r = document.documentElement, b = document.querySelector('.theme-toggle');
      if (!b) return;
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      var colors = { light: '#faf9f5', dark: '#1f1e1d' };
      function apply(t) {
        r.setAttribute('data-theme', t);
        var zh = r.getAttribute('data-lang') === 'zh';
        var label = zh ? (t === 'dark' ? '切换到浅色模式' : '切换到深色模式') : (t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        b.setAttribute('aria-label', label);
        b.setAttribute('title', label);
        metas.forEach(function (m) { m.removeAttribute('media'); m.setAttribute('content', colors[t]); });
      }
      apply(r.getAttribute('data-theme'));
      document.addEventListener('langchange', function () { apply(r.getAttribute('data-theme')); });
      b.addEventListener('click', function () {
        var t = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(t);
        try { localStorage.setItem('theme', t); } catch (e) {}
      });
      var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      if (mq && mq.addEventListener) mq.addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (x) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
