---
layout: default
---
<article class="article">
  <a class="back-link" href="{{ '/' | relative_url }}#journal">← Back to posts</a>
  <header class="article-header"><time class="article-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time><h1>{{ page.title | escape }}</h1></header>
  <div class="prose">{{ content }}</div>
</article>
